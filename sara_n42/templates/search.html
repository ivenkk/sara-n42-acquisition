<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SARA N42 · 检索下载</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>SARA N42</h1>
      <p>检索下载</p>
    </div>
    <nav class="nav" aria-label="页面导航">
      <a class="nav-link" href="/">实时能谱</a>
      <a class="nav-link active" href="/search">检索下载</a>
    </nav>
  </header>

  <main class="search-main" aria-label="按时间检索本地能谱">
    <section class="search-form" aria-label="检索条件">
      <div class="field">
        <label for="instrument">仪器</label>
        <select id="instrument" aria-label="选择仪器（可选）">
          <option value="">全部仪器</option>
          {% for inst in instruments %}
          <option value="{{ inst.host }}">{{ inst.name }} ({{ inst.host }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label for="start">测量时间起</label>
        <input type="datetime-local" id="start" required />
      </div>
      <div class="field">
        <label for="end">测量时间止</label>
        <input type="datetime-local" id="end" required />
      </div>
      <div class="field actions">
        <button type="button" id="btn-search">检索</button>
        <button type="button" id="btn-download" disabled>下载 ZIP</button>
      </div>
    </section>

    <section class="search-result" aria-live="polite">
      <p id="search-hint" class="muted">选择时间范围后检索。结果只显示匹配数量，不列出文件名。</p>
      <p id="search-count" class="count hidden"></p>
      <p id="search-error" class="error hidden"></p>
    </section>
  </main>

  <footer class="foot">
    <span id="status-line">就绪</span>
  </footer>

  <script>
    window.SARA_UI = { page: "search" };
  </script>
  <script src="/static/search.js"></script>
</body>
</html>
