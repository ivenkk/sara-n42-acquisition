<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SARA N42 能谱展示</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>SARA N42</h1>
      <p>能谱采集与展示</p>
    </div>
    <div class="controls">
      <label for="instrument">仪器</label>
      <select id="instrument" aria-label="选择仪器">
        {% for inst in instruments %}
        <option value="{{ inst.host }}" {% if inst.host == default_host %}selected{% endif %}>
          {{ inst.name }} ({{ inst.host }})
        </option>
        {% else %}
        <option value="" disabled selected>未配置仪器</option>
        {% endfor %}
      </select>
      <button type="button" id="btn-refresh">刷新</button>
      <label class="auto">
        <input type="checkbox" id="auto-refresh" checked />
        每 {{ poll_interval_seconds }} 秒自动刷新
      </label>
    </div>
  </header>

  <main class="layout">
    <section class="file-panel" aria-label="文件列表">
      <h2>已下载文件</h2>
      <p id="file-empty" class="empty hidden">该仪器尚无符合规则的本地文件。</p>
      <ul id="file-list"></ul>
    </section>
    <section class="chart-panel" aria-label="能谱曲线">
      <div class="chart-meta">
        <div id="chart-title">请选择文件</div>
        <div id="chart-subtitle"></div>
      </div>
      <div id="chart" role="img" aria-label="能谱曲线图"></div>
      <p id="chart-error" class="error hidden"></p>
    </section>
  </main>

  <footer class="foot">
    <span id="status-line">就绪</span>
  </footer>

  <script>
    window.SARA_UI = {
      pollIntervalSeconds: {{ poll_interval_seconds | int }},
      defaultHost: {{ default_host | tojson }},
    };
  </script>
  <script src="/static/app.js"></script>
</body>
</html>
