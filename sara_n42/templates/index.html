<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SARA N42 · 实时能谱</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>SARA N42</h1>
      <p>实时能谱</p>
    </div>
    <nav class="nav" aria-label="页面导航">
      <a class="nav-link active" href="/">实时能谱</a>
      <a class="nav-link" href="/search">检索下载</a>
    </nav>
    <div class="controls">
      <button type="button" id="btn-refresh">刷新</button>
      <label class="auto">
        <input type="checkbox" id="auto-refresh" checked />
        每 {{ poll_interval_seconds }} 秒自动刷新
      </label>
    </div>
  </header>

  <main class="live-main" aria-label="各仪器最新能谱">
    <p id="live-empty" class="empty hidden">未配置仪器。请编辑 config.yaml 后重启。</p>
    <div id="spectra-grid" class="spectra-grid"></div>
  </main>

  <footer class="foot">
    <span id="status-line">就绪</span>
  </footer>

  <script>
    window.SARA_UI = {
      pollIntervalSeconds: {{ poll_interval_seconds | int }},
      page: "live",
    };
  </script>
  <script src="/static/app.js"></script>
</body>
</html>
